name: CI - Code Quality & Integrity Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Seed Demo Database
      run: |
        python data/seed_demo.py

    - name: Run Integrity & Syntax Linters
      run: |
        python curatorship_pipeline/scripts/validate_tokens_and_tags.py
        python curatorship_pipeline/scripts/verify_database_integrity.py

    - name: Run Automated Test Suite
      run: |
        pytest tests/ -v
